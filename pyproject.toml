[project]
name = "hippo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.0",
    "google-genai>=2.22.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "mem0ai>=2.0.20",
    "pydantic>=2.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "socksio>=1.0.0",
    "typer>=0.12.0",
]

[project.scripts]
hippo = "hippo_memory.cli:app"
hippo-mcp = "hippo_memory.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hippo_memory"]

[tool.hatch.build.targets.wheel.force-include]
"integrations/pi/hippo-memory.ts" = "hippo_memory/integrations/pi/hippo-memory.ts"

[tool.hatch.build.targets.sdist]
include = [
    "/hippo_memory",
    "/integrations",
    "/README.md",
    "/AGENTS.md",
]
