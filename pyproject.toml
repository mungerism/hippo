[project]
name = "hippo-memory"
version = "0.1.0"
description = "Lightweight memory hub and MCP server for AI coding agents based on Mem0 & Qdrant"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "mungerism" }]
keywords = ["ai", "memory", "mcp", "mem0", "qdrant", "llm", "agent", "coding-agent"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastembed>=0.8.0",
    "google-genai>=2.22.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "mem0ai>=2.0.20",
    "pydantic>=2.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "socksio>=1.0.0",
    "typer>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/mungerism/hippo"
Repository = "https://github.com/mungerism/hippo"
Documentation = "https://mungerism.github.io/hippo/"
Issues = "https://github.com/mungerism/hippo/issues"

[project.scripts]
hippo = "hippo_memory.cli:app"
hippo-mcp = "hippo_memory.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hippo_memory"]

[tool.hatch.build.targets.wheel.force-include]
"integrations/pi/hippo-memory.ts" = "hippo_memory/integrations/pi/hippo-memory.ts"

[tool.hatch.build.targets.sdist]
include = [
    "/hippo_memory",
    "/integrations",
    "/README.md",
    "/AGENTS.md",
    "/LICENSE",
]

