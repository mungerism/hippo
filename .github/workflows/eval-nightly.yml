name: Nightly Evaluation & Regression Gates

on:
  schedule:
    # Run daily at 02:00 UTC (10:00 AM CST)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      include_qa:
        description: 'Run end-to-end LLM reader/judge evaluation (requires GEMINI_API_KEY secret)'
        required: false
        default: false
        type: boolean
      max_injected:
        description: 'Max injected memories budget'
        required: false
        default: '3'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly-eval:
    name: Nightly Regression & Benchmarks
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -s http://localhost:6333/readyz || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify Qdrant Service Health
        run: |
          echo "Checking Qdrant readiness at 127.0.0.1:6333..."
          curl -f -s http://127.0.0.1:6333/readyz || (echo "Qdrant not ready!" && exit 1)
          echo "Qdrant is healthy."

      - name: Create Nightly Reports Directory
        run: mkdir -p benchmarks/reports/nightly

      - name: Run Hippo Gold v1 with Live Engine & Baseline Regression Gate
        run: |
          echo "Executing Hippo Gold v1 evaluation against baseline..."
          uv run python -m benchmarks.runner \
            --dataset benchmarks/data/hippo_gold_v1.json \
            --adapter engine \
            --collection eval_nightly_gold_${{ github.run_id }} \
            --baseline benchmarks/baselines/hippo_gold_v1_baseline.json \
            --max-injected ${{ inputs.max_injected || '3' }} \
            --output-dir benchmarks/reports/nightly \
            --report-name hippo_gold_v1_nightly

      - name: Run LongMemEval-S Evaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ] && [ "${{ inputs.include_qa }}" == "true" ]; then
            echo "Running LongMemEval-S full QA tier with Gemini..."
            uv run python -m benchmarks.runner \
              --dataset longmemeval-fixture \
              --tier all \
              --qa-backend gemini \
              --max-injected ${{ inputs.max_injected || '3' }} \
              --output-dir benchmarks/reports/nightly \
              --report-name longmemeval_nightly
          else
            echo "Running LongMemEval-S retrieval tier (offline/graceful degradation)..."
            uv run python -m benchmarks.runner \
              --dataset longmemeval-fixture \
              --tier retrieval \
              --max-injected ${{ inputs.max_injected || '3' }} \
              --output-dir benchmarks/reports/nightly \
              --report-name longmemeval_nightly
          fi

      - name: Run LoCoMo-10 Benchmark Evaluation
        run: |
          echo "Executing LoCoMo-10 benchmark..."
          uv run python -m benchmarks.runner \
            --dataset locomo-fixture \
            --tier all \
            --max-injected ${{ inputs.max_injected || '3' }} \
            --output-dir benchmarks/reports/nightly \
            --report-name locomo_nightly

      - name: Publish Step Summary
        if: always()
        run: |
          echo "# 🌙 Hippo Nightly Evaluation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID**: \`${{ github.run_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for md in benchmarks/reports/nightly/*.md; do
            if [ -f "$md" ]; then
              echo "---" >> $GITHUB_STEP_SUMMARY
              cat "$md" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Upload Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hippo-nightly-eval-${{ github.run_id }}
          path: benchmarks/reports/nightly/
          retention-days: 30
