name: Nightly Evaluation & Regression Gates

on:
  schedule:
    # Run daily at 02:00 UTC (10:00 Beijing time).
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      include_qa:
        description: 'Also run LongMemEval-S end-to-end QA (requires GEMINI_API_KEY)'
        required: false
        default: false
        type: boolean
      max_injected:
        description: 'Max injected memories budget'
        required: false
        default: '3'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly-eval:
    name: Nightly Regression & Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HIPPO_PROVIDER: vertexai
      VERTEX_EMBEDDING_MODEL: gemini-embedding-2
      VERTEX_EMBEDDING_DIMS: '768'
      GOOGLE_CLOUD_LOCATION: global
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ENGINE_EVAL_ENABLED: 'false'
    services:
      qdrant:
        # Pin the engine used by the approved baseline; do not use :latest.
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify Qdrant Service Health
        run: |
          echo "Waiting for Qdrant readiness at 127.0.0.1:6333..."
          for attempt in {1..30}; do
            if curl -f -s http://127.0.0.1:6333/readyz >/dev/null; then
              echo "Qdrant is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Qdrant did not become ready within 60 seconds." >&2
          exit 1

      - name: Configure Vertex AI Credentials
        if: env.GOOGLE_CREDENTIALS_JSON != '' && env.GOOGLE_CLOUD_PROJECT != ''
        run: |
          credentials_path="${RUNNER_TEMP}/gcp-credentials.json"
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > "$credentials_path"
          chmod 600 "$credentials_path"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_path" >> "$GITHUB_ENV"
          echo "ENGINE_EVAL_ENABLED=true" >> "$GITHUB_ENV"

      - name: Explain Missing Engine Credentials
        if: env.GOOGLE_CREDENTIALS_JSON == '' || env.GOOGLE_CLOUD_PROJECT == ''
        run: |
          {
            echo "## Nightly engine evaluation skipped"
            echo ""
            echo "The approved Hippo Gold baseline uses Vertex AI embeddings."
            echo "Configure GOOGLE_CREDENTIALS_JSON and GOOGLE_CLOUD_PROJECT repository secrets"
            echo "to enable the live Qdrant + Vertex regression gate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create Nightly Reports & State Directories
        run: mkdir -p benchmarks/reports/nightly .cache/eval

      - name: Restore P95 Latency Breach State
        if: env.ENGINE_EVAL_ENABLED == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache/eval
          key: eval-latency-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            eval-latency-${{ github.ref_name }}-

      - name: Run Hippo Gold v1 with Live Engine & Baseline Regression Gate
        if: env.ENGINE_EVAL_ENABLED == 'true'
        run: |
          uv run python -m benchmarks.runner \
            --dataset benchmarks/data/hippo_gold_v1.json \
            --adapter engine \
            --collection eval_nightly_gold_${{ github.run_id }} \
            --baseline benchmarks/baselines/hippo_gold_v1_baseline.json \
            --latency-state .cache/eval/hippo_gold_v1_latency.json \
            --max-injected 3 \
            --output-dir benchmarks/reports/nightly \
            --report-name hippo_gold_v1_nightly

      - name: Run LongMemEval-S Retrieval with Live Engine
        if: env.ENGINE_EVAL_ENABLED == 'true'
        run: |
          uv run python -m benchmarks.runner \
            --dataset longmemeval-s \
            --adapter engine \
            --tier retrieval \
            --collection eval_nightly_longmem_${{ github.run_id }} \
            --max-injected ${{ inputs.max_injected || '3' }} \
            --output-dir benchmarks/reports/nightly \
            --report-name longmemeval_retrieval_nightly

      - name: Run Optional LongMemEval-S End-to-End QA
        if: env.ENGINE_EVAL_ENABLED == 'true' && env.GEMINI_API_KEY != '' && inputs.include_qa == true
        run: |
          uv run python -m benchmarks.runner \
            --dataset longmemeval-s \
            --adapter engine \
            --tier end-to-end \
            --qa-backend gemini \
            --collection eval_nightly_longmem_qa_${{ github.run_id }} \
            --max-injected ${{ inputs.max_injected || '3' }} \
            --output-dir benchmarks/reports/nightly \
            --report-name longmemeval_e2e_nightly

      - name: Run Offline Fixture When Engine Credentials Are Missing
        if: env.ENGINE_EVAL_ENABLED != 'true'
        run: |
          uv run python -m benchmarks.runner \
            --dataset longmemeval-fixture \
            --tier retrieval \
            --max-injected ${{ inputs.max_injected || '3' }} \
            --output-dir benchmarks/reports/nightly \
            --report-name longmemeval_fixture_nightly

      - name: Publish Step Summary
        if: always()
        run: |
          echo "# Hippo Nightly Evaluation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Run ID**: \`${{ github.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger**: \`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Live engine enabled**: \`$ENGINE_EVAL_ENABLED\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          for md in benchmarks/reports/nightly/*.md; do
            if [ -f "$md" ]; then
              echo "---" >> "$GITHUB_STEP_SUMMARY"
              cat "$md" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Save P95 Latency Breach State
        if: always() && env.ENGINE_EVAL_ENABLED == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/eval
          key: eval-latency-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hippo-nightly-eval-${{ github.run_id }}
          path: benchmarks/reports/nightly/
          retention-days: 30
