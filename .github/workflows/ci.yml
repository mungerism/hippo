name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Bytecode compilation check (compileall)
        run: uv run python -m compileall hippo_memory tests

      - name: Syntax & undefined name gate (Ruff)
        run: uvx ruff check --select E9,F63,F7,F82 hippo_memory tests

  test:
    name: Tests (Ubuntu / Python 3.12)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit & seam tests
        run: uv run python -m unittest discover -s tests -t . -v

  qdrant-integration:
    name: Real Qdrant Integration
    runs-on: ubuntu-latest
    needs: lint
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    env:
      HIPPO_ENABLE_REAL_QDRANT_TESTS: "1"
      HIPPO_TEST_QDRANT_HOST: "127.0.0.1"
      HIPPO_TEST_QDRANT_PORT: "6333"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify Qdrant is reachable
        run: uv run python -c "from qdrant_client import QdrantClient; print(QdrantClient(host='127.0.0.1', port=6333).get_collections())"

      - name: Run real storage contract
        run: uv run python -m unittest tests.test_explicit_write.TestExplicitWriteIntegration -v

  build:
    name: Build Distribution Package
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build wheel and sdist
        run: uv build

      - name: Inspect build artifacts
        run: |
          ls -lh dist/
          tar -ztvf dist/*.tar.gz | grep "integrations/pi/hippo-memory.ts"

  docs:
    name: Docs as Code (VitePress Build & Link Gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "docs/pnpm-lock.yaml"

      - name: Install documentation dependencies
        run: pnpm --dir docs install

      - name: Build VitePress documentation site
        run: pnpm --dir docs run build

  eval-contract:
    name: Evaluation PR Contract (Deterministic Replay)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate Hippo Gold v1 Dataset Integrity
        run: uv run python -m benchmarks.gold.validator --dataset benchmarks/data/hippo_gold_v1.json

      - name: Run Hippo Gold v1 Replay Contract
        run: uv run python -m benchmarks.runner --dataset benchmarks/data/hippo_gold_v1.json

      - name: Run LongMemEval-S Smoke Fixture Replay Contract
        run: uv run python -m benchmarks.runner --dataset longmemeval-fixture --tier all --qa-backend mock

      - name: Run LoCoMo-10 Smoke Fixture Replay Contract
        run: uv run python -m benchmarks.runner --dataset locomo-fixture --tier all

      - name: Run BEAM Scale Smoke Fixture Replay Contract
        run: uv run python -m benchmarks.runner --dataset beam-fixture --adapter replay

      - name: Run LMEB Dialogue Memory Smoke Fixture Replay Contract
        run: uv run python -m benchmarks.runner --dataset lmeb-fixture --adapter replay

