name: 💡 Feature Request
description: Suggest an idea or proposal for Hippo
title: "[Feat]: "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? (English is preferred, Chinese is welcome / 欢迎中英文提案)
        Remember Hippo's core tenet: A lightweight wrapper over Mem0 focusing on spec alignment and minimal dependencies.
  - type: textarea
    id: problem
    attributes:
      label: Problem & Motivation
      description: What problem are you trying to solve?
      placeholder: In the context of ..., currently ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: How should this be implemented or improved?
      placeholder: I propose to add / change ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you have considered?
