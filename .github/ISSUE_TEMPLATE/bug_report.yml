name: 🐛 问题反馈
description: 反馈缺陷或非预期行为
title: "[缺陷]: "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！标题和正文默认使用中文，技术标识保留原文。
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 请清晰、简洁地描述问题。
      placeholder: 请描述发生了什么……
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请列出复现问题的步骤。
      placeholder: |
        1. 运行 `hippo ...` 或在 IDE 中接入 MCP
        2. 执行……
        3. 出现错误……
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与诊断信息
      description: 请运行 `hippo doctor` 并附上输出，隐去密钥等私密信息。
      render: shell
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统版本、Python 版本及 IDE / Agent 客户端。
      placeholder: macOS 15.0 / Python 3.12 / Cursor / gemini-3.5-flash-lite
    validations:
      required: true
