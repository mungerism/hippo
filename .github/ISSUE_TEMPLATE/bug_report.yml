name: 🐛 Bug Report
description: Report an issue or unexpected behavior
title: "[Bug]: "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! (English is preferred, Chinese is welcome / 欢迎中英文反馈)
  - type: textarea
    id: what-happened
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `hippo ...` or mount MCP in IDE
        2. Execute ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs & Doctor Diagnostics
      description: Please run `hippo doctor` and attach the output (redacting any private credentials).
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, Python version, IDE / Agent client.
      placeholder: macOS 15.0 / Python 3.12 / Cursor / gemini-3.5-flash-lite
    validations:
      required: true
